apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: auth-credentials-gcp
  namespace: default
spec:
  targetRefs:
    - kind: HTTPRoute
      name: test
      group: gateway.networking.k8s.io
  backend:
    auth:
      passthrough: {}
      credentials:
        - location:
            header:
              name: Proxy-Authorization
              prefix: "Bearer "
          gcp:
            type: IdToken
            audience: iap-client-id
---
# Output
output:
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      backend:
        auth:
          credentials:
          - gcp:
              idToken:
                audience: iap-client-id
            location:
              header:
                name: Proxy-Authorization
                prefix: 'Bearer '
          passthrough: {}
      key: backend/default/auth-credentials-gcp:backend-auth:default/test
      name:
        kind: AgentgatewayPolicy
        name: auth-credentials-gcp
        namespace: default
      target:
        route:
          kind: HTTPRoute
          name: test
          namespace: default
