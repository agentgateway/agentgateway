syntax = "proto3";

package ateapi;

// Minimal wire-compatible subset of the Substrate control API used by
// agentgateway's actor policies.
service Control {
  rpc GetActor(GetActorRequest) returns (Actor) {}
  rpc ResumeActor(ResumeActorRequest) returns (ResumeActorResponse) {}
  rpc GetActorEgressPolicy(GetActorEgressPolicyRequest) returns (EgressPolicy) {}
}

message Actor {
  ResourceMetadata metadata = 1;
  ActorStatus status = 7;
}

message ActorStatus {
  ActorState state = 1;
  WorkerAssignment worker_assignment = 2;
}

enum ActorState {
  ACTOR_STATE_UNSPECIFIED = 0;
  ACTOR_STATE_RESUMING = 1;
  ACTOR_STATE_RUNNING = 2;
  ACTOR_STATE_SUSPENDING = 3;
  ACTOR_STATE_SUSPENDED = 4;
  ACTOR_STATE_PAUSING = 5;
  ACTOR_STATE_PAUSED = 6;
  ACTOR_STATE_CRASHED = 7;
  ACTOR_STATE_DELETING = 8;
}

// The minimal running-actor assignment required by AgentGateway ingress.
message WorkerAssignment {
  string worker_pod_ip = 5;
}

message ResourceMetadata {
  string uid = 3;
  int64 version = 4;
}

message ObjectRef {
  string atespace = 1;
  string name = 2;
}

message ResumeActorRequest {
  ObjectRef actor = 1;
  bool boot = 2;
}

message ResumeActorResponse {
  Actor actor = 1;
  // True if a resume workflow was executed to activate the actor.
  // False if the actor was already RUNNING.
  bool resumed = 2;
}

message GetActorRequest {
  ObjectRef actor = 1;
}

// EgressPolicy is the actor-owned source policy. Rules are unordered allows;
// the most specific matching hostname, then port, selects the deciding rule.
message EgressPolicy {
  ResourceMetadata metadata = 1;
  repeated EgressRule rules = 2;
}

message EgressRule {
  HTTPRule http = 1;
  HTTPSRule https = 2;
  TLSPassthroughRule tls_passthrough = 3;
}

message HTTPRule {
  repeated string hostnames = 1;
  // Defaults to port 80 when absent. Matches the port the actor connected to.
  Ports ports = 2;
  HttpRuleEffects effects = 3;
}

message HTTPSRule {
  repeated string hostnames = 1;
  // Defaults to port 443 when absent.
  Ports ports = 2;
  HttpRuleEffects effects = 3;
}

message TLSPassthroughRule {
  repeated string hostnames = 1;
  Ports ports = 2;
}

message Ports {
  AllPorts all = 1;
  repeated int32 numbers = 2;
}

message AllPorts {}

message HttpRuleEffects {
  // Replace only headers already present in the actor's request.
  repeated CredentialHeader replace_headers = 1;
}

message CredentialHeader {
  string header = 1;
  string prefix = 2;
  string credential_uri = 3;
}

message GetActorEgressPolicyRequest {
  ObjectRef actor = 1;
}
