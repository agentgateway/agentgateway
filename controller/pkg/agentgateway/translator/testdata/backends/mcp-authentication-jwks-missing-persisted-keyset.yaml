    Name: basic
    Namespace: default
  resource:
    backend:
      inlinePolicies:
      - mcpAuthentication:
          jwksInline: '{"keys":[]}'
          mode: STRICT
          resourceMetadata: {}
      key: default/mcp-backend
      mcp: {}
      name:
        name: mcp-backend
        namespace: default
status:
