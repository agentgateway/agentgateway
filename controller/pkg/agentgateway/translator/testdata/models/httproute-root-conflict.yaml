apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-gateway
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: agentgateway.dev
        kind: AgentgatewayModel
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: direct-model
  namespace: default
spec:
  parentRefs:
  - name: model-gateway
    sectionName: http
  provider: OpenAI
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: root-models
  namespace: default
spec:
  parentRefs:
  - name: model-gateway
    sectionName: http
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: "*"
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: route-model
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: root-models
  provider: OpenAI

---
# Output
output:
- gateway:
    Name: model-gateway
    Namespace: default
  resource:
    backend:
      ai:
        providerGroups:
        - providers:
          - name: backend
            openai: {}
      key: default/direct-model/backend.http
      name:
        name: direct-model
        namespace: default
- gateway:
    Name: model-gateway
    Namespace: default
  resource:
    bind:
      key: 80/default/model-gateway
      port: 80
- gateway:
    Name: model-gateway
    Namespace: default
  resource:
    listener:
      bindKey: 80/default/model-gateway
      key: default/model-gateway.http
      name:
        gatewayName: model-gateway
        gatewayNamespace: default
        listenerName: http
      protocol: HTTP
- gateway:
    Name: model-gateway
    Namespace: default
  resource:
    modelRoute:
      concreteModel:
        backend:
          backend: default/direct-model/backend.http
      key: default/direct-model.http
      listenerKey: default/model-gateway.http
      match:
        model: direct-model
status:
- apiVersion: agentgateway.dev/v1alpha1
  kind: AgentgatewayModel
  metadata:
    name: direct-model
    namespace: default
  spec: null
  status:
    parents:
    - conditions:
      - lastTransitionTime: fake
        message: Successfully accepted AgentgatewayModel
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: fake
        message: ""
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: agentgateway.dev/agentgateway
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: model-gateway
        namespace: default
        sectionName: http
- apiVersion: agentgateway.dev/v1alpha1
  kind: AgentgatewayModel
  metadata:
    name: route-model
    namespace: default
  spec: null
  status:
    parents:
    - conditions:
      - lastTransitionTime: fake
        message: 'root model-serving HTTPRoute conflicts with directly attached models
          on listeners: default/model-gateway.http'
