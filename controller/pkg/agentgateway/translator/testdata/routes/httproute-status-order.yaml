apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-route
  namespace: default
spec:
  parentRefs:
  - name: test-gateway
  hostnames:
  - example.com
  rules:
  - backendRefs:
    - name: test-service
      port: 80
status:
  parents:
    # Our entry comes first and is refreshed in place.
    - parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: test-gateway
        namespace: default
      conditions:
        - lastTransitionTime: "2026-04-22T17:57:23Z"
          message: stale
          reason: Pending
          status: "False"
          type: Accepted
        - lastTransitionTime: "2026-04-22T17:57:23Z"
          message: stale
          reason: Pending
          status: "False"
          type: ResolvedRefs
      controllerName: agentgateway.dev/agentgateway
    # Another controller's entry that sorts before ours; it must keep its position.
    - parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: a-other-gw
        namespace: default
      conditions:
        - lastTransitionTime: "2026-04-22T17:57:23Z"
          message: Accepted by fake controller
          reason: Accepted
          status: "True"
          type: Accepted
      controllerName: other-controller.example.com/controller
---
# Output
output:
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    route:
      backends:
      - backend:
          port: 80
          service:
            hostname: test-service.default.svc.cluster.local
            namespace: default
        weight: 1
      hostnames:
      - example.com
      key: default/test-route.00.http
      listenerKey: default/test-gateway.http
      name:
        kind: HTTPRoute
        name: test-route
        namespace: default
status:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: test-route
    namespace: default
  spec: null
  status:
    parents:
    - conditions:
      - lastTransitionTime: fake
        message: ""
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: fake
        message: ""
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: agentgateway.dev/agentgateway
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: test-gateway
        namespace: default
    - conditions:
      - lastTransitionTime: fake
        message: Accepted by fake controller
        reason: Accepted
        status: "True"
        type: Accepted
      controllerName: other-controller.example.com/controller
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: a-other-gw
        namespace: default
