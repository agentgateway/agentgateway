init_config: {}
instances:
- use_latest_spec: true
  openmetrics_endpoint: http://gateway:15020/metrics
  namespace: agentgateway
  raw_metric_prefix: agentgateway_
  metrics:
  - requests: requests
    request_duration_seconds: request.duration
    request_processing_seconds: request.processing
    response_bytes: response.bytes
    downstream_connections: downstream.connections
    downstream_connections_shed: downstream.connections_shed
    requests_shed: requests_shed
    retries: retries
    guardrail_checks: guardrail.checks
    cost_catalog_lookups: cost_catalog.lookups
    gen_ai_client_token_usage: gen_ai.token.usage
    gen_ai_client_cost_usd: gen_ai.cost.usd
    gen_ai_server_request_duration: gen_ai.request.duration
    gen_ai_server_time_to_first_token: gen_ai.time_to_first_token
    gen_ai_server_time_per_output_token: gen_ai.time_per_output_token
  - .*
  exclude_metrics:
  - mcp_requests
  include_labels:
  - gateway
  - listener
  - route
  - backend
  - method
  - status
  - reason
  - protocol
  - gen_ai_operation_name
  - gen_ai_system
  - gen_ai_request_model
  - gen_ai_response_model
  - gen_ai_token_type
  - phase
  - action
  - le
  - bind
  - route_rule
  - kind
  - subtype
  - transport
  - tag
  - url
  rename_labels:
    gen_ai_system: provider
    gen_ai_request_model: request_model
    gen_ai_response_model: response_model
    gen_ai_token_type: token_type
  histogram_buckets_as_distributions: true
  collect_counters_with_distributions: true
  tags:
  - service:agentgateway
  - env:datadog-dev
  - component:proxy
