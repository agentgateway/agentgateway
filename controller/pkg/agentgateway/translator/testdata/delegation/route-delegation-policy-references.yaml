apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parent
  namespace: default
spec:
  parentRefs:
  - name: test-gateway
  hostnames:
  - delegation.example
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /anything/team1
    backendRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: "*"
      namespace: team1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: child-team1-foo
  namespace: team1
spec:
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /anything/team1/foo
    backendRefs:
    - name: httpbin
      port: 8000
  - matches:
    - path:
        type: PathPrefix
        value: /anything/team1/pool/with-grant
    backendRefs:
    - name: pool-with-grant
      namespace: pool-ns
      group: inference.networking.k8s.io
      kind: InferencePool
  - matches:
    - path:
        type: PathPrefix
        value: /anything/team1/pool/without-grant
    backendRefs:
    - name: pool-without-grant
      namespace: pool-ns
      group: inference.networking.k8s.io
      kind: InferencePool
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: team1
spec:
  ports:
  - port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: pool-endpoint-picker
  namespace: pool-ns
spec:
  ports:
  - port: 9002
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: pool-with-grant
  namespace: pool-ns
spec:
  endpointPickerRef:
    failureMode: FailClose
    group: ""
    kind: Service
    name: pool-endpoint-picker
    port:
      number: 9002
  selector:
    matchLabels:
      app: with-grant
  targetPorts:
  - number: 8080
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: pool-without-grant
  namespace: pool-ns
spec:
  endpointPickerRef:
    failureMode: FailClose
    group: ""
    kind: Service
    name: pool-endpoint-picker
    port:
      number: 9002
  selector:
    matchLabels:
      app: without-grant
  targetPorts:
  - number: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-child-pool
  namespace: pool-ns
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: team1
  to:
  - group: inference.networking.k8s.io
    kind: InferencePool
    name: pool-with-grant
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: policy-be
  namespace: team1
spec:
  static:
    host: example.com
    port: 80
---
# Policy is attached to gateway via Route -> Route -> Gateway
# policy-be should be attached via BE -> Policy -> Route -> Route -> Gateway
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agw
  namespace: team1
spec:
  targetRefs:
    - kind: HTTPRoute
      name: child-team1-foo
      group: gateway.networking.k8s.io
  traffic:
    extAuth:
      grpc: {}
      backendRef:
        name: policy-be
        group: agentgateway.dev
        kind: AgentgatewayBackend
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-parent
  namespace: team1
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: default
  to:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: child-team1-foo
---
# Output
output:
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    backend:
      key: team1/policy-be
      name:
        name: policy-be
        namespace: team1
      static:
        host: example.com
        port: 80
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    policy:
      backend:
        inferenceRouting:
          endpointPicker:
            port: 9002
            service:
              hostname: pool-endpoint-picker.pool-ns.svc.cluster.local
              namespace: pool-ns
          failureMode: FAIL_CLOSED
      key: pool-ns/pool-with-grant:inference
      name:
        kind: InferencePool
        name: pool-with-grant
        namespace: pool-ns
      target:
        service:
          hostname: pool-with-grant.pool-ns.inference.cluster.local
          namespace: pool-ns
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    policy:
      backend:
        backendTls:
          verification: INSECURE_ALL
      key: pool-ns/pool-with-grant:inferencetls
      name:
        kind: InferencePool
        name: pool-with-grant
        namespace: pool-ns
      target:
        service:
          hostname: pool-endpoint-picker.pool-ns.svc.cluster.local
          namespace: pool-ns
          port: 9002
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    policy:
      key: traffic/team1/agw:extauth:team1/child-team1-foo
      name:
        kind: AgentgatewayPolicy
        name: agw
        namespace: team1
      target:
        route:
          kind: HTTPRoute
          name: child-team1-foo
          namespace: team1
      traffic:
        extAuthz:
          grpc: {}
          target:
            backend: team1/policy-be
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    route:
      backends:
      - routeGroupKey: default/parent/team1/*
        weight: 1
      hostnames:
      - delegation.example
      key: default/parent.00.http
      listenerKey: default/test-gateway.http
      matches:
      - path:
          pathPrefix: /anything/team1
      name:
        kind: HTTPRoute
        name: parent
        namespace: default
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    route:
      backends:
      - backend:
          port: 8000
          service:
            hostname: httpbin.team1.svc.cluster.local
            namespace: team1
        weight: 1
      key: team1/child-team1-foo.00.routegroup.default.parent.team1.wildcard
      matches:
      - path:
          pathPrefix: /anything/team1/foo
      name:
        kind: HTTPRoute
        name: child-team1-foo
        namespace: team1
      routeGroupKey: default/parent/team1/*
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    route:
      backends:
      - backend:
          port: 8080
          service:
            hostname: pool-with-grant.pool-ns.inference.cluster.local
            namespace: pool-ns
        weight: 1
      key: team1/child-team1-foo.01.routegroup.default.parent.team1.wildcard
      matches:
      - path:
          pathPrefix: /anything/team1/pool/with-grant
      name:
        kind: HTTPRoute
        name: child-team1-foo
        namespace: team1
      routeGroupKey: default/parent/team1/*
status:
- apiVersion: inference.networking.k8s.io/v1
  kind: InferencePool
  metadata:
    name: pool-with-grant
    namespace: pool-ns
  spec: null
  status:
    parents:
    - conditions:
      - lastTransitionTime: fake
        message: InferencePool has been accepted by controller agentgateway.dev/agentgateway
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: fake
        message: All InferencePool references have been resolved
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: agentgateway.dev/agentgateway
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: test-gateway
        namespace: default
- apiVersion: inference.networking.k8s.io/v1
  kind: InferencePool
  metadata:
    name: pool-without-grant
    namespace: pool-ns
  spec: null
  status: {}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: parent
    namespace: default
  spec: null
  status:
    parents:
    - conditions:
      - lastTransitionTime: fake
        message: ""
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: fake
        message: ""
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: agentgateway.dev/agentgateway
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: test-gateway
        namespace: default
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: child-team1-foo
    namespace: team1
  spec: null
  status:
    parents: []
