# Equal timestamps fall back to namespace/name, then listener order.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example
  namespace: default
spec:
  gatewayClassName: agentgateway
  allowedListeners:
    namespaces:
      from: All
  listeners:
  - name: owner
    port: 8080
    protocol: HTTP
    hostname: owner.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: a
  namespace: default
spec:
  parentRef:
    name: example
  listeners:
  - name: first
    port: 8080
    protocol: HTTP
    hostname: shared.example.com
  - name: second
    port: 8080
    protocol: HTTP
    hostname: shared.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: b
  namespace: default
spec:
  parentRef:
    name: example
  listeners:
  - name: http
    port: 8080
    protocol: HTTP
    hostname: shared.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: a
  namespace: tenant
spec:
  parentRef:
    name: example
    namespace: default
  listeners:
  - name: http
    port: 8080
    protocol: HTTP
    hostname: shared.example.com
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant

---
# Output
output:
- gateway:
    Name: example
    Namespace: default
  resource:
    bind:
      key: 8080/default/example
      port: 8080
- gateway:
    Name: example
    Namespace: default
  resource:
    listener:
      bindKey: 8080/default/example
      hostname: shared.example.com
      key: default/a.first
      name:
        gatewayName: example
        gatewayNamespace: default
        listenerName: first
        listenerSet:
          name: a
          namespace: default
      protocol: HTTP
- gateway:
    Name: example
    Namespace: default
  resource:
    listener:
      bindKey: 8080/default/example
      hostname: owner.example.com
      key: default/example.owner
      name:
        gatewayName: example
        gatewayNamespace: default
        listenerName: owner
      protocol: HTTP
