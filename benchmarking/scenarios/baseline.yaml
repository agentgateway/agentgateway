# Baseline arm for the agentgateway vs plain Service comparison.
# Just a bare Kubernetes Service in front of the decode pod -- no gateway,
# no EPP, no proxy of any kind. gateway.className: none is what does this,
# see the gateway class table in llm-d-benchmark's docs/standup.md
#
# Decode-only on purpose: this mode can't do prefill/decode disaggregation
# at all (the chart rejects prefill replicas here), so we keep the
# agentgateway arm decode-only too, otherwise the comparison isn't fair.

scenario:
- name: plain-service-decode-only
  model:
    name: facebook/opt-125m
    shortName: facebook-opt-125m
    path: models/facebook/opt-125m
    huggingfaceId: facebook/opt-125m
    maxModelLen: 1024
    gpuMemoryUtilization: 0

  # CPU-only, runs the simulated model server, no GPU needed for this pass
  affinity:
    enabled: true
    nodeSelector:
      kubernetes.io/os: linux
  accelerator:
    count: 0
    memory: 24

  gateway:
    className: none

  # Minimal resources so this fits on a Kind node
  router:
    epp:
      resources:
        requests:
          cpu: "100m"
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
    proxy:
      resources:
        requests:
          cpu: "50m"
          memory: 128Mi
        limits:
          cpu: "500m"
          memory: 512Mi

  monitoring:
    installPrometheusCrds: true

  vllmCommon:
    shmMemory: 500Mi

  storage:
    modelPvc:
      accessModes:
        - ReadWriteOnce
      storageClassName: standard
      size: 2Gi
    workloadPvc:
      accessModes:
        - ReadWriteOnce
      storageClassName: standard
      size: 3Gi

  images:
    vllm:
      repository: ghcr.io/llm-d/llm-d-inference-sim
      tag: v0.8.2

  fma:
    enabled: false

  decode:
    replicas: 3
    parallelism:
      tensor: 0
      data: 1
      dataLocal: 1
      workers: 1
    resources:
      limits:
        memory: 100Mi
        cpu: "0"
      requests:
        memory: 100Mi
        cpu: "0"
    accelerator:
      count: 0
    vllm:
      modelCommand: imageDefault

  # No prefill -- this mode can't route to it anyway, and we want to
  # match the agentgateway arm for a fair comparison
  prefill:
    enabled: false
    replicas: 0
    parallelism:
      tensor: 0
      data: 1
      dataLocal: 1
      workers: 1
    resources:
      limits:
        memory: 100Mi
        cpu: "0"
      requests:
        memory: 100Mi
        cpu: "0"
    accelerator:
      count: 0
    vllm:
      modelCommand: imageDefault

  modelservice:
    enabled: true
    uriProtocol: hf

  control:
    waitTimeout: 20

  harness:
    name: inference-perf
    experimentProfile: sanity_random.yaml
    resources:
      cpu: "1"
      memory: 2Gi
