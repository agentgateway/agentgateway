apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-gateway
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenants
  namespace: default
spec:
  parentRefs:
  - name: model-gateway
    sectionName: http
  # The named rule "0" currently collides with the unnamed rule at index 0.
  # The expected output below shows the correct behavior: the public rule uses
  # router key :index:0, while the private rule and its model use its name, :0.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /public
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: "*"
  - name: "0"
    matches:
    - path:
        type: PathPrefix
        value: /private
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: "*"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: private-model
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenants
    sectionName: "0"
  provider: OpenAI
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: private-auth
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenants
    sectionName: "0"
  traffic:
    basicAuthentication:
      secretRef:
        name: private-users
---
apiVersion: v1
kind: Secret
metadata:
  name: private-users
  namespace: default
stringData:
  .htpasswd: alice:hash

