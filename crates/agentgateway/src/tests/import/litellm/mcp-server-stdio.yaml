model_list:
- model_name: gpt-4o
  litellm_params:
    model: openai/gpt-4o
general_settings:
  master_key: sk-test-master-key
mcp_servers:
  local_fs:
    transport: "stdio"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
    env:
      FS_ROOT: "/data"
      FS_TOKEN: "os.environ/FS_TOKEN"
    allow_all_keys: true
