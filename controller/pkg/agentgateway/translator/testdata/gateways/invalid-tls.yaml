apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-gateway
  namespace: default
spec:
  gatewayClassName: agentgateway
  allowedListeners:
    namespaces:
      from: All
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: api.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: missing
            kind: Secret
---
# An invalid TLS winner still reserves its hostname. A distinct catch-all can
# coexist, but must not take over the winner's more-specific hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: fallback
  namespace: default
spec:
  parentRef:
    name: test-gateway
  listeners:
  - name: duplicate
    port: 443
    protocol: HTTPS
    hostname: api.example.com
    tls:
      certificateRefs:
      - name: missing
  - name: catch-all
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: missing
---
