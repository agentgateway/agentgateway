apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example
  namespace: default
spec:
  gatewayClassName: agentgateway
  allowedListeners:
    namespaces:
      from: All
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: foo.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: tls
            kind: Secret
---
kind: Secret
apiVersion: v1
metadata:
  name: tls
  namespace: default
type: kubernetes.io/tls
data:
  ## Dummy key/cert is sufficient for our testing purposes
  tls.crt: 
  tls.key: 
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: passthrough
  namespace: default
spec:
  parentRef:
    name: example
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
    - name: tls-passthrough
      port: 443
      protocol: TLS
      hostname: bar.example.com
      tls:
        mode: Passthrough
    - name: tls-overlap
      port: 443
      protocol: TLS
      hostname: foo.example.com
      tls:
        mode: Passthrough
    - name: http-conflict
      port: 443
      protocol: HTTP
      hostname: baz.example.com

---
# Output
output:
