# Current-state recovery: the duplicate and incompatible listeners moved
# ports. Previously conflicted statuses must not survive.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example
  namespace: default
  generation: 2
spec:
  gatewayClassName: agentgateway
  allowedListeners:
    namespaces:
      from: All
  listeners:
  - name: http
    port: 8080
    protocol: HTTP
    hostname: owner.example.com
  - name: duplicate
    port: 8081
    protocol: HTTP
  - name: incompatible
    port: 8083
    protocol: TCP
status:
  listeners:
  - name: http
    attachedRoutes: 0
    supportedKinds:
    - kind: HTTPRoute
    conditions:
    - type: Conflicted
      status: "False"
      reason: NoConflicts
      message: No errors found
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Accepted
      status: "True"
      reason: Accepted
      message: No errors found
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Programmed
      status: "True"
      reason: Programmed
      message: No errors found
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
  - name: duplicate
    attachedRoutes: 0
    supportedKinds:
    - kind: HTTPRoute
    conditions:
    - type: Conflicted
      status: "True"
      reason: HostnameConflict
      message: previous conflict
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Accepted
      status: "False"
      reason: HostnameConflict
      message: previous conflict
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Programmed
      status: "False"
      reason: HostnameConflict
      message: previous conflict
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
  - name: incompatible
    attachedRoutes: 0
    supportedKinds:
    - kind: TCPRoute
    conditions:
    - type: Conflicted
      status: "True"
      reason: ProtocolConflict
      message: previous conflict
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Accepted
      status: "False"
      reason: ProtocolConflict
      message: previous conflict
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Programmed
      status: "False"
      reason: ProtocolConflict
      message: previous conflict
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
---
# The higher-precedence ListenerSet is absent; this remaining candidate now
# wins, even though its stored status still describes the old conflict.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: remaining
  namespace: default
  generation: 2
spec:
  parentRef:
    name: example
  listeners:
  - name: http
    port: 8080
    protocol: HTTP
    hostname: shared.example.com
  - name: wildcard
    port: 8080
    protocol: HTTP
    hostname: "*.example.com"
  - name: catch-all
    port: 8080
    protocol: HTTP
status:
  conditions:
  - type: Accepted
    status: "False"
    reason: ListenersNotValid
    message: previous conflict
    observedGeneration: 1
    lastTransitionTime: "2026-01-01T00:00:00Z"
  listeners:
  - name: http
    attachedRoutes: 0
    supportedKinds:
    - kind: HTTPRoute
    conditions:
    - type: Conflicted
      status: "True"
      reason: HostnameConflict
      message: previous conflict
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Accepted
      status: "False"
      reason: HostnameConflict
      message: previous conflict
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Programmed
      status: "False"
      reason: HostnameConflict
      message: previous conflict
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"

---
