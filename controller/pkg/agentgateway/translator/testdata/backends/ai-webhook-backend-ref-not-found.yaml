apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  namespace: default
  name: anthropic-backend
spec:
  ai:
    provider:
      anthropic:
        model: claude-4-5-sonnet
  policies:
    ai:
      promptGuard:
        request:
        - webhook:
            backendRef:
              name: invalid-request-ref
              port: 123
        response:
        - webhook:
            backendRef:
              name: invalid-response-ref
              port: 456
---
# Output
output:
- gateway:
    Name: basic
    Namespace: default
  resource:
    backend:
      ai:
        providerGroups:
        - providers:
          - anthropic:
              model: claude-4-5-sonnet
            name: backend
      inlinePolicies:
      - ai:
          promptGuard:
            request:
            - webhook:
                action: REJECT_AUDIT_ACTION_REJECT
            response:
            - webhook:
                action: REJECT_AUDIT_ACTION_REJECT
      key: default/anthropic-backend
      name:
        name: anthropic-backend
        namespace: default
status:
- apiVersion: agentgateway.dev/v1alpha1
  kind: AgentgatewayBackend
  metadata:
    name: anthropic-backend
    namespace: default
  spec: null
  status:
    conditions:
    - lastTransitionTime: fake
      message: |-
        failed to translate backend: failed to build webhook: unable to find the Service default/invalid-request-ref
        failed to build webhook: unable to find the Service default/invalid-response-ref
      reason: PartiallyValid
      status: "True"
      type: Accepted
