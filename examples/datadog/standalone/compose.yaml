name: agentgateway-datadog
services:
  homehub:
    image: ghcr.io/solo-io/homehub-support-demo:${HOMEHUB_TAG:?Load versions.env}
    read_only: true
    ports:
      - "127.0.0.1:18080:8080"
  datadog:
    image: registry.datadoghq.com/agent:${DATADOG_AGENT_VERSION:?Load versions.env}
    ports:
      - "127.0.0.1:4318:4318"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DD_API_KEY: ${DD_API_KEY:?Set DD_API_KEY in .env}
      DD_SITE: ${DD_SITE:?Set DD_SITE in .env}
      DD_HOSTNAME: agentgateway-datadog-demo
      DD_ENV: datadog-dev
      DD_TAGS: "env:datadog-dev service:agentgateway component:proxy"
      DD_APM_ENABLED: "true"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "false"
      DD_LOGS_ENABLED: "false"
    volumes:
      - ./openmetrics.yaml:/etc/datadog-agent/conf.d/openmetrics.d/conf.yaml:ro
