        namespace: default
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    route:
      backends:
      - routeGroupKey: default/parent/team2/*
        weight: 1
      hostnames:
      - delegation.example
      key: default/parent.01.http
      listenerKey: default/test-gateway.http
      matches:
      - path:
          pathPrefix: /anything/team2
      name:
