    matches:
    - path:
        type: PathPrefix
        value: /tenant-b
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: "*"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: tenant-a-model
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant-a-models
    sectionName: models
  provider: OpenAI
  baseURL: http://ai-testbox.default.svc.cluster.local:9234
  policies:
    transformations:
    - field: model
      expression: '"agw-tenant-a-model"'
---
apiVersion: agentgateway.dev/v1alpha1
