apiVersion: v1
kind: ConfigMap
metadata:
  name: ca
  namespace: agentgateway-base
data:
  ca.crt: invalid
---
apiVersion: v1
kind: Secret
metadata:
  name: ca
  namespace: agentgateway-base
type: Opaque
data:
  ca.crt: 
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: secret-ca
  namespace: agentgateway-base
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: backend
  backend:
    tls:
      sni: localhost
      caCertificateRefs:
      - name: ca
        kind: Secret
