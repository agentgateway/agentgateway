apiVersion: v1
kind: Service
metadata:
  name: infra-backend-v1
  namespace: default
spec:
  ports:
    - name: https
      port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: ctb-tls
  namespace: default
spec:
  targetRefs:
    - name: infra-backend-v1
      kind: Service
      group: ""
  validation:
    hostname: example.com
    caCertificateRefs:
      - name: example-ca
        group: certificates.k8s.io
        kind: ClusterTrustBundle
