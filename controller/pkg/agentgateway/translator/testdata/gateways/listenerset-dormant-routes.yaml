# Conflicted parents retain route attachment/status, not dataplane listeners.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example
  namespace: default
spec:
  gatewayClassName: agentgateway
  allowedListeners:
    namespaces:
      from: All
  listeners:
  - name: hostname
    port: 8080
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: protocol
    port: 8081
    protocol: TCP
  - name: bind-mode
    port: 8082
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: delegate
  namespace: default
  annotations:
    agentgateway.dev/internal-ports: "8082"
spec:
  parentRef:
    name: example
  listeners:
  - name: hostname
    port: 8080
    protocol: HTTP
  - name: protocol
    port: 8081
    protocol: HTTP
  - name: bind-mode
    port: 8082
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dormant
  namespace: default
spec:
  parentRefs:
  - kind: ListenerSet
    name: delegate
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

---
