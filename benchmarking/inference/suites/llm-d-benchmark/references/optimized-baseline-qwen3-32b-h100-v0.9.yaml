# Locked infrastructure profile for reproducing the historical llm-d v0.9
# Qwen3-32B/H100 report. The report-era calibration matrix records vLLM
# v0.23.0; do not replace this with the image currently selected by the
# mutable v0.9 guide overlay.
scenario:
  - name: optimized-baseline-qwen3-32b-h100-v0.9
    images:
      vllm:
        repository: docker.io/vllm/vllm-openai
        tag: v0.23.0
    vllmCommon:
      shmMemory: 20Gi
    decode:
      replicas: 8
      parallelism:
        tensor: 2
        data: 1
        dataLocal: 1
        workers: 1
      resources:
        limits: {memory: 128Gi, cpu: "16"}
        requests: {memory: 96Gi, cpu: "8"}
      vllm:
        # Match the report-era optimized-baseline command surface. In
        # particular, avoid adding the wrapper's newer block-size,
        # max-model-len, and gpu-memory-utilization flags.
        customCommand: |
          vllm serve /model-cache/$MODEL_PATH \
          --host 0.0.0.0 \
          --served-model-name $MODEL_NAME \
          --port $VLLM_METRICS_PORT \
          --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
          --tensor-parallel-size=$TP_SIZE
    router:
      epp:
        resources:
          limits: {memory: 16Gi}
          requests: {memory: 8Gi, cpu: "4"}
