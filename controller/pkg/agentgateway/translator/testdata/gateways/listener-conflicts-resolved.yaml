    bind:
      key: 8081/default/example
      port: 8081
- gateway:
    Name: example
    Namespace: default
  resource:
    bind:
      key: 8083/default/example
      port: 8083
      protocol: TCP
- gateway:
    Name: example
    Namespace: default
  resource:
    listener:
      bindKey: 8081/default/example
      key: default/example.duplicate
      name:
        gatewayName: example
        gatewayNamespace: default
        listenerName: duplicate
      protocol: HTTP
- gateway:
    Name: example
    Namespace: default
  resource:
    listener:
      bindKey: 8080/default/example
      hostname: owner.example.com
      key: default/example.http
      name:
        gatewayName: example
        gatewayNamespace: default
        listenerName: http
      protocol: HTTP
- gateway:
    Name: example
    Namespace: default
  resource:
    listener:
      bindKey: 8083/default/example
      key: default/example.incompatible
      name:
        gatewayName: example
        gatewayNamespace: default
        listenerName: incompatible
      protocol: TCP
- gateway:
    Name: example
    Namespace: default
  resource:
    listener:
      bindKey: 8080/default/example
      key: default/remaining.catch-all
      name:
        gatewayName: example
        gatewayNamespace: default
        listenerName: catch-all
        listenerSet:
          name: remaining
          namespace: default
      protocol: HTTP
- gateway:
    Name: example
    Namespace: default
  resource:
    listener:
      bindKey: 8080/default/example
      hostname: shared.example.com
      key: default/remaining.http
      name:
        gatewayName: example
        gatewayNamespace: default
        listenerName: http
        listenerSet:
          name: remaining
          namespace: default
      protocol: HTTP
- gateway:
    Name: example
    Namespace: default
  resource:
    listener:
      bindKey: 8080/default/example
      hostname: '*.example.com'
      key: default/remaining.wildcard
      name:
        gatewayName: example
        gatewayNamespace: default
        listenerName: wildcard
        listenerSet:
          name: remaining
          namespace: default
      protocol: HTTP
