apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parent
  namespace: default
spec:
  parentRefs:
    - name: test-gateway
  hostnames:
    - delegation.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anything/team1
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: "*"
          namespace: team1
    - matches:
        - path:
            type: PathPrefix
            value: /anything/team2
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: "*"
          namespace: team2
---
# A second parent delegating to the same namespace: svc1 must report one
# status.parents entry per distinct delegating parent, sorted deterministically.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parent2
  namespace: default
spec:
  parentRefs:
    - name: test-gateway
  hostnames:
    - delegation2.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anything/team1
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: "*"
          namespace: team1
---
# Parentless delegated child, granted: must report status.parents pointing at
# the delegating parent HTTPRoute (issue #1559).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: svc1
  namespace: team1
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anything/team1/foo
      backendRefs:
        - name: httpbin
          port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: team1
spec:
  ports:
    - port: 8000
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-parent
  namespace: team1
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: svc1
---
# Parentless delegated child, NOT granted: data plane skips it, status must
# report Accepted=False with RefNotPermitted instead of silently passing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: svc2
  namespace: team2
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anything/team2/foo
      backendRefs:
        - name: httpbin
          port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: team2
spec:
  ports:
    - port: 8000

---
# Output
output:
