# Tier-specific vLLM Semantic Router pools and routes.
apiVersion: vllm.ai/v1alpha1
kind: IntelligentPool
metadata:
  name: basic-models
  namespace: semantic-router-basic
  labels:
    app.kubernetes.io/part-of: tiered-semantic-routing
    agentgateway.dev/entitlement-tier: basic
spec:
  defaultModel: gpt-4.1
  models:
  - name: gpt-4.1
  - name: gpt-5.4
    reasoningFamily: gpt
---
apiVersion: vllm.ai/v1alpha1
kind: IntelligentRoute
metadata:
  name: basic-routing
  namespace: semantic-router-basic
  labels:
    app.kubernetes.io/part-of: tiered-semantic-routing
    agentgateway.dev/entitlement-tier: basic
spec:
  signals:
    keywords:
    - name: stem
      operator: OR
      keywords:
      - quantum physics
      - physics
      - chemistry
      - biology
      - mathematics
      - engineering
      caseSensitive: false
  decisions:
  - name: stem
    priority: 100
    description: Route Basic STEM prompts to GPT-5.4.
    signals:
      operator: AND
      conditions:
      - type: keyword
        name: stem
    modelRefs:
    - model: gpt-5.4
      useReasoning: false
---
