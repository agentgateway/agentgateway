apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: be
  namespace: default
spec:
  static:
    host: be.example.com
    port: 80
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agw
  namespace: default
spec:
  targetRefs:
    - kind: AgentgatewayBackend
      name: be
      group: agentgateway.dev
  backend:
    sessionAffinity:
      source: request.headers["x-session-id"]
---
# Output
output:
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      backend:
        sessionAffinity:
          source: request.headers["x-session-id"]
      key: default/agw:session-affinity:default/be
      name:
        kind: AgentgatewayPolicy
        name: agw
        namespace: default
      target:
        backend:
          name: be
          namespace: default
status:
