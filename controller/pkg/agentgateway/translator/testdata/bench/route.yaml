#refresh=true
# .routes HTTPRoutes per app, each attached to the app's ListenerSet on every gateway.
{{ range $rc := until (int .routes) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{$.Name}}-{{.}}
spec:
  hostnames:
    - {{$.Name}}.example.com
  parentRefs:
  {{ range $gw := $.gateways }}
  {{ $spl := split "/" $gw }}
  - name: {{$.Name}}-{{$spl._1}}
    kind: ListenerSet
    group: gateway.networking.k8s.io
  {{ end }}
  rules:
    - backendRefs:
        - name: {{$.Name}}
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /{{.}}/{{$.RandNumber}}
---
{{ end }}
