credential_list:
- credential_name: shared-openai
  credential_info:
    provider: openai
  credential_values:
    api_key: os.environ/OPENAI_API_KEY
    api_base: https://api.openai.example/v1
- credential_name: unused
  credential_values:
    api_key: os.environ/UNUSED_API_KEY
- credential_name: duplicate
  credential_values:
    api_key: os.environ/FIRST_API_KEY
- credential_name: duplicate
  credential_values:
    api_key: os.environ/SECOND_API_KEY
- credential_name: unsupported-values
  credential_values:
    azure_ad_token: os.environ/AZURE_AD_TOKEN
model_list:
- model_name: overridden
  litellm_params:
    model: openai/gpt-4o
    litellm_credential_name: shared-openai
    api_base: https://override.example/v1
- model_name: missing
  litellm_params:
    model: openai/gpt-4o-mini
    litellm_credential_name: missing
- model_name: ambiguous
  litellm_params:
    model: openai/gpt-4.1
    litellm_credential_name: duplicate
- model_name: unsupported
  litellm_params:
    model: azure/gpt-4.1
    litellm_credential_name: unsupported-values
