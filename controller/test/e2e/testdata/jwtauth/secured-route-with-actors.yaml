apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-actors
  namespace: agentgateway-base
spec:
  parentRefs:
    - name: gateway
  hostnames:
    - "actorsroute.com"
  rules:
    - backendRefs:
        - name: backend
          port: 80
---
# jwks were generated using hack/utils/jwt/jwt-generator.go
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: route-actors-policy
  namespace: agentgateway-base
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: route-actors
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'has(jwt.act) && jwt.act.recurse("act").all(a, a.sub in ["agent-a", "agent-b"])'
