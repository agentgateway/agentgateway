apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-backendauth-invalid-gcp-credential
  namespace: agentgateway-base
spec:
  parentRefs:
    - name: gateway
  hostnames:
    - invalid-gcp-credential.example.com
  rules:
    - backendRefs:
        - name: backend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-backendauth-healthy-alongside-invalid-gcp-credential
  namespace: agentgateway-base
spec:
  parentRefs:
    - name: gateway
  hostnames:
    - healthy-alongside-invalid-gcp-credential.example.com
  rules:
    - backendRefs:
        - name: backend
          port: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: invalid-gcp-credential
  namespace: agentgateway-base
type: Opaque
stringData:
  key.json: |
    {"type":"service_account","project_id":"repro","private_key_id":"x","private_key":"PRIVATE_KEY"}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: backendauth-invalid-gcp-credential
  namespace: agentgateway-base
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: route-backendauth-invalid-gcp-credential
  backend:
    auth:
      gcp:
        type: AccessToken
        secretRef:
          name: invalid-gcp-credential
          key: key.json
