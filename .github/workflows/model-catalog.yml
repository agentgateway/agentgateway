name: Refresh model catalog

on:
  schedule:
  - cron: '17 8 * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: refresh-model-catalog
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh catalog
    if: github.repository == 'agentgateway/agentgateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Push the generated catalog to the automation branch.
      pull-requests: write # Open or update the catalog pull request.
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Refresh catalog
      run: make refresh-model-catalog

    - name: Check for changes
      id: changes
      shell: bash
      run: |
        if git diff --quiet -- catalog/model-catalog.json; then
          echo 'changed=false' >> "$GITHUB_OUTPUT"
        else
          echo 'changed=true' >> "$GITHUB_OUTPUT"
        fi

    - name: Validate changes
      if: steps.changes.outputs.changed == 'true'
      shell: bash
      run: |
        changed_files="$(git diff --name-only)"
        if [ "$changed_files" != 'catalog/model-catalog.json' ]; then
          echo "refresh changed unexpected files:" >&2
          echo "$changed_files" >&2
          exit 1
        fi
        go test ./controller/pkg/cli/catalog

    - name: Commit and open or update pull request
      if: steps.changes.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: automation/refresh-model-catalog
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- catalog/model-catalog.json
        git diff --cached --check
        git commit -m 'Update model catalog'

        gh auth setup-git
        remote_sha="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
        if [ -n "$remote_sha" ]; then
          git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" origin "HEAD:refs/heads/$BRANCH"
        else
          git push origin "HEAD:refs/heads/$BRANCH"
        fi

        pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
        if [ -z "$pr" ]; then
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title 'Update model catalog' \
            --body 'Automated refresh of the checked-in model catalog from models.dev.'
        else
          echo "Updated pull request #$pr"
        fi
