apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-url-rewrite
  namespace: default
spec:
  parentRefs:
  - name: test-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /full
    backendRefs:
    - name: test-service
      port: 80
      filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplaceFullPath
            replaceFullPath: /rewritten-full
  - matches:
    - path:
        type: PathPrefix
        value: /prefix
    backendRefs:
    - name: test-service
      port: 80
      filters:
      - type: URLRewrite
        urlRewrite:
          hostname: rewritten.example.com
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /rewritten-prefix

---
# Output
output:
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    route:
      backends:
      - backend:
          port: 80
          service:
            hostname: test-service.default.svc.cluster.local
            namespace: default
        backendPolicies:
        - urlRewrite:
            full: /rewritten-full
        weight: 1
      key: default/backend-url-rewrite.00.http
      listenerKey: default/test-gateway.http
      matches:
      - path:
          pathPrefix: /full
      name:
        kind: HTTPRoute
        name: backend-url-rewrite
        namespace: default
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    route:
      backends:
      - backend:
          port: 80
          service:
            hostname: test-service.default.svc.cluster.local
            namespace: default
        backendPolicies:
        - urlRewrite:
            host: rewritten.example.com
            prefix: /rewritten-prefix
        weight: 1
      key: default/backend-url-rewrite.01.http
      listenerKey: default/test-gateway.http
      matches:
      - path:
          pathPrefix: /prefix
      name:
        kind: HTTPRoute
        name: backend-url-rewrite
        namespace: default
status:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: backend-url-rewrite
    namespace: default
  spec: null
  status:
    parents:
    - conditions:
      - lastTransitionTime: fake
        message: ""
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: fake
        message: ""
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: agentgateway.dev/agentgateway
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: test-gateway
        namespace: default
