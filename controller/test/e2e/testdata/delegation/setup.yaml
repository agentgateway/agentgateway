apiVersion: v1
kind: Namespace
metadata:
  name: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: team1
---
apiVersion: v1
kind: Namespace
metadata:
  name: team2
---
apiVersion: v1
kind: Namespace
metadata:
  name: team2-root
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: svc1
  namespace: team1
spec:
  static:
    host: backend.agentgateway-base.svc.cluster.local
    port: 80
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: svc2
  namespace: team2
spec:
  static:
    host: backend.agentgateway-base.svc.cluster.local
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-infra-route-delegation
  namespace: team1
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: infra
  to:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-team2-root-route-delegation
  namespace: team2
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: team2-root
  to:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
