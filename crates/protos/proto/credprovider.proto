syntax = "proto3";

package credprovider;

// CredentialProvider resolves an external credential reference. The provider
// owns authorization and secret storage; AgentGateway only brokers a request.
service CredentialProvider {
  rpc FetchSecret(FetchSecretRequest) returns (FetchSecretResponse) {}
}

message FetchSecretRequest {
  // Credential URI of the form ate-secret://<provider name>/<provider tail>.
  string uri = 1;
  // The verified SPIFFE ID of the actor on whose behalf the secret is fetched.
  string actor_spiffe_id = 2;
}

message FetchSecretResponse {
  bytes opaque_bytes = 1;
}
