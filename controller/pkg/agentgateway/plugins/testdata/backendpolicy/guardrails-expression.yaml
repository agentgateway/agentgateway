apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: guardrails-expression
  namespace: default
spec:
  targetRefs:
    - kind: Gateway
      name: test
      group: gateway.networking.k8s.io
  backend:
    mcp:
      guardrails:
        processors:
        - expression:
            condition: mcp.params.name == 'restricted_tool'
            reject: This tool is unavailable
          methods:
            tools/call: Request
        - expression:
            transform: >-
              mcp.result.merge({
                'content': mcp.result.content.map(c,
                  c.type == 'text'
                    ? c.merge({'text': c.text.regexReplaceAll('secret-[A-Za-z0-9]+', '[REDACTED]')})
                    : c)
              })
          methods:
            tools/call: Response

---
# Output
output:
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      backend:
        mcpGuardrails:
          processors:
          - expression:
              condition: mcp.params.name == 'restricted_tool'
              reject: This tool is unavailable
            methods:
              tools/call: REQUEST
          - expression:
              transform: |-
                mcp.result.merge({
                  'content': mcp.result.content.map(c,
                    c.type == 'text'
                      ? c.merge({'text': c.text.regexReplaceAll('secret-[A-Za-z0-9]+', '[REDACTED]')})
                      : c)
                })
            methods:
              tools/call: RESPONSE
      key: backend/default/guardrails-expression:mcp-guardrails:default/test
      name:
        kind: AgentgatewayPolicy
        name: guardrails-expression
        namespace: default
      target:
        gateway:
          name: test
          namespace: default
status:
- apiVersion: agentgateway.dev/v1alpha1
  kind: AgentgatewayPolicy
  metadata:
    name: guardrails-expression
    namespace: default
  spec: null
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: test
        namespace: default
      conditions:
      - lastTransitionTime: fake
        message: Policy accepted
        reason: Valid
        status: "True"
        type: Accepted
      - lastTransitionTime: fake
        message: Attached to all targets
        reason: Attached
        status: "True"
        type: Attached
      controllerName: agentgateway.dev/agentgateway
