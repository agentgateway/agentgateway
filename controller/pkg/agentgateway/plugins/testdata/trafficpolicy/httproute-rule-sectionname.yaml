apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: named-rules
  namespace: default
spec:
  parentRefs:
  - name: test
  hostnames:
  - "rules.example.com"
  rules:
  - name: rule-one
    backendRefs:
    - name: svc1
      port: 8080
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agw
  namespace: default
spec:
  targetRefs:
  - kind: HTTPRoute
    name: named-rules
    group: gateway.networking.k8s.io
    sectionName: rule-one
  traffic:
    timeouts:
      request: 5s

---
# Output
output:
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      key: traffic/default/agw:timeout:default/named-rules/rule-one
      name:
        kind: AgentgatewayPolicy
        name: agw
        namespace: default
      target:
        route:
          kind: HTTPRoute
          name: named-rules
          namespace: default
          routeRule: rule-one
      traffic:
        timeout:
          request: 5s
status:
