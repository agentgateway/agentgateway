  namespace: default
  creationTimestamp: "2026-01-02T00:00:00Z"
spec:
  parentRef:
    name: example
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
    - name: shared
      protocol: HTTP
      port: 8080
      hostname: shared.example.com
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
