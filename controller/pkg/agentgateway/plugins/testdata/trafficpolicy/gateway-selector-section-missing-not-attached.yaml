apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: labeled-gw
  namespace: default
  labels:
    app: labeled
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agw
  namespace: default
spec:
  targetSelectors:
  - kind: Gateway
    group: gateway.networking.k8s.io
    matchLabels:
      app: labeled
    sectionName: no-such-listener
  traffic:
    timeouts:
      request: 5s

---
# Output
output:
- gateway:
    Name: labeled-gw
    Namespace: default
  resource:
    policy:
      key: traffic/default/agw:timeout:default/labeled-gw/no-such-listener
      name:
        kind: AgentgatewayPolicy
        name: agw
        namespace: default
      target:
        gateway:
          listener: no-such-listener
          name: labeled-gw
          namespace: default
      traffic:
        timeout:
          request: 5s
status:
- apiVersion: agentgateway.dev/v1alpha1
  kind: AgentgatewayPolicy
  metadata:
    name: agw
    namespace: default
  spec: null
  status:
    ancestors:
    - ancestorRef:
        group: agentgateway.dev
        name: StatusSummary
      conditions:
      - lastTransitionTime: fake
        message: Policy accepted
        reason: Valid
        status: "True"
        type: Accepted
      - lastTransitionTime: fake
        message: 'Policy is not attached: sectionName "no-such-listener" not found
          in Gateway default/labeled-gw'
        reason: Pending
        status: "False"
        type: Attached
      controllerName: agentgateway.dev/agentgateway
