metadata:
  name: tenant-b-model
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant-b-models
    sectionName: models
  provider: OpenAI
  baseURL: http://ai-testbox.default.svc.cluster.local:9234
  policies:
    transformations:
    - field: model
      expression: '"agw-tenant-b-model"'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tenant-a-models-auth
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant-a-models
    sectionName: models
  traffic:
    basicAuthentication:
      mode: Strict
      users:
      - "tenant-a:$apr1$SrcRE04W$bio6ASdFjG8ANvVHWgfr80"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tenant-b-models-auth
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant-b-models
    sectionName: models
  traffic:
    basicAuthentication:
      mode: Strict
      users:
      - "tenant-b:$apr1$dNQyeFtD$xsHfBS/Bn5fbMLhjNlV1A/"
