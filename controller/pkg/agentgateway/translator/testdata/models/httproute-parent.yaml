- gateway:
    Name: model-gateway
    Namespace: default
  resource:
    route:
      backends:
      - backend:
          backend: /llm:router:httproute:default:tenant1:models
        weight: 1
      key: default/tenant1.00.http
      listenerKey: default/model-gateway.http
      matches:
      - path:
          pathPrefix: /tenant1
      name:
        kind: HTTPRoute
        name: tenant1
        namespace: default
        ruleName: models
      trafficPolicies:
      - urlRewrite:
          prefix: ""
