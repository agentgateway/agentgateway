# Copy this file outside the repository, replace every REPLACE_* value, and
# apply the resulting file. Never commit the populated copy.
apiVersion: v1
kind: Secret
metadata:
  name: netbird-server-config
  namespace: netbird-agent-network
type: Opaque
stringData:
  config.yaml: |
    server:
      listenAddress: ":8080"
      exposedAddress: "https://${NETBIRD_MANAGEMENT_DOMAIN}:443"
      stuns:
        - uri: "stun:stun.netbird.io:3478"
      metricsPort: 9090
      healthcheckAddress: ":9000"
      logLevel: "info"
      logFile: "console"
      authSecret: "${NETBIRD_AUTH_SECRET}"
      dataDir: "/var/lib/netbird"
      disableAnonymousMetrics: true
      disableGeoliteUpdate: true
      auth:
        issuer: "https://${NETBIRD_MANAGEMENT_DOMAIN}/oauth2"
        sessionCookieEncryptionKey: "${NETBIRD_SESSION_KEY}"
        cliRedirectURIs:
          - "http://localhost:53000/"
      store:
        engine: "sqlite"
        encryptionKey: "${NETBIRD_STORE_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: netbird-openai
  namespace: netbird-agent-network
type: Opaque
stringData:
  Authorization: "${OPENAI_API_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: netbird-anthropic
  namespace: netbird-agent-network
type: Opaque
stringData:
  Authorization: "${ANTHROPIC_API_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: netbird-agentgateway-keys
  namespace: netbird-agent-network
type: Opaque
stringData:
  netbird: '{"keyHash":"sha256:${NETBIRD_VIRTUAL_KEY_SHA256}"}'
