apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pool-route
  namespace: default
spec:
  parentRefs:
    - name: test
  rules:
    - backendRefs:
        - name: pool
          kind: InferencePool
          group: inference.networking.k8s.io
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: pool
  namespace: default
spec:
  endpointPickerRef:
    failureMode: FailOpen
    group: ""
    kind: Service
    name: pool-epp
    port:
      number: 9002
  selector:
    matchLabels:
      app: model
  targetPorts:
    - number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pool-epp
  namespace: default
spec:
  ports:
    - name: grpc
      port: 9002
  selector:
    app: epp
---
# The EPP Service is only reachable via InferencePool -> HTTPRoute -> Gateway
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: epp-timeout
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: pool-epp
  backend:
    http:
      requestTimeout: 900s

---
# Output
output:
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      backend:
        backendHttp:
          requestTimeout: 900s
      key: default/epp-timeout:backend-http:default/pool-epp.default.svc.cluster.local
      name:
        kind: AgentgatewayPolicy
        name: epp-timeout
        namespace: default
      target:
        service:
          hostname: pool-epp.default.svc.cluster.local
          namespace: default
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      backend:
        inferenceRouting:
          endpointPicker:
            port: 9002
            service:
              hostname: pool-epp.default.svc.cluster.local
              namespace: default
          failureMode: FAIL_OPEN
      key: default/pool:inference
      name:
        kind: InferencePool
        name: pool
        namespace: default
      target:
        service:
          hostname: pool.default.inference.cluster.local
          namespace: default
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      backend:
        backendTls:
          verification: INSECURE_ALL
      key: default/pool:inferencetls
      name:
        kind: InferencePool
        name: pool
        namespace: default
      target:
        service:
          hostname: pool-epp.default.svc.cluster.local
          namespace: default
          port: 9002
status: []
