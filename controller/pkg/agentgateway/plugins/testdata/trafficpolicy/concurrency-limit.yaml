apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: concurrency-limit
  namespace: default
spec:
  targetRefs:
  - kind: Gateway
    name: test
    group: gateway.networking.k8s.io
  traffic:
    rateLimit:
      concurrency:
      - maxConcurrent: 32
      - maxConcurrent: 4
        key: jwt.sub
      - maxConcurrent: 2
        key: jwt.sub + "/" + llm.requestModel

---
# Output
output:
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      key: traffic/default/concurrency-limit:concurrency:default/test
      name:
        kind: AgentgatewayPolicy
        name: concurrency-limit
        namespace: default
      target:
        gateway:
          name: test
          namespace: default
      traffic:
        concurrencyLimit:
          rules:
          - maxConcurrent: 32
          - key: jwt.sub
            maxConcurrent: 4
          - key: jwt.sub + "/" + llm.requestModel
            maxConcurrent: 2
status:
