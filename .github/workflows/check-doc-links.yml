# Doc comments across this repo cite absolute agentgateway.dev URLs. When the docs site
# reorganises, it keeps serving the old path through a redirect, so nothing here looks
# broken and the stale link stays until that redirect is retired.
#
# A 301 is not an error, so this is invisible from inside the repo. This workflow asks the
# live site instead: it follows each link and repoints any that has permanently moved.
#
# Fixing them here promptly matters because the docs site generates its reference pages
# from a release TAG. A link fixed after a tag is cut cannot reach the published docs until
# the next release, so the repo is the only place the fix can start.
name: Check doc links

on:
  schedule:
    # Weekly on Monday. Pages move on the scale of a docs reorganisation, not daily.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: check-doc-links
  cancel-in-progress: false

jobs:
  check:
    name: Repoint moved doc links
    # Forks inherit workflows but not the intent to open pull requests here.
    if: github.repository == 'agentgateway/agentgateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Push the fixes to the automation branch.
      pull-requests: write # Open or update the pull request.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only the standard library is used, so the runner's Python needs no setup and there
      # is nothing to install or pin.

      # This job edits generated API types unattended, and the pull request it opens does
      # not run CI (see the note on the commit step), so the script's own behaviour is
      # checked here before it is trusted to rewrite anything.
      - name: Test the link checker
        shell: bash
        env:
          # The commit step below runs `git add --all`, and this repo does not gitignore
          # __pycache__, so importing the module under test would otherwise put compiled
          # bytecode into the pull request.
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      # Exit codes: 0 nothing to do, 2 the site could not be reached, 3 a link is dead.
      # Both failures are deliberate. A run that could not fetch anything used to report
      # "no moved links found" and pass, which made an outage look identical to a clean
      # result every week.
      # continue-on-error so that a dead link (exit 3) still lets the moved links below be
      # committed. The job is failed again at the end, after the pull request exists.
      - name: Check and repoint doc links
        id: links
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/check_doc_links.py \
            --write \
            --summary "$RUNNER_TEMP/doc-links-body.md"

      # The script replaces one URL with another and touches nothing else, so anything
      # outside that shape means it misfired and the run should stop rather than open a
      # pull request nobody can trust.
      - name: Validate changes
        if: steps.links.outputs.changed == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'script reported changes but the tree is clean' >&2
            exit 1
          fi
          if ! git diff -U0 | grep -qE '^[-+].*agentgateway\.dev'; then
            echo 'changes do not touch any agentgateway.dev link:' >&2
            git diff --stat >&2
            exit 1
          fi

      # NOTE FOR REVIEWERS. This pull request is created with GITHUB_TOKEN, and GitHub does
      # not run workflows on a pull request opened by it. So the repo's own checks, codegen
      # verification included, will NOT have run on it. The script's tests run above, and
      # the generated CRD manifests are edited alongside their Go source, but neither is a
      # substitute. Push an empty commit, or close and reopen the pull request, to get a
      # real CI run before merging. The permanent fix is a GitHub App token, which needs an
      # org admin to issue.
      - name: Commit and open or update pull request
        if: steps.links.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/refresh-doc-links
          TITLE: 'Repoint doc links that have moved'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m "${TITLE}"

          gh auth setup-git
          remote_sha="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "${TITLE}" \
              --body-file "$RUNNER_TEMP/doc-links-body.md"
          else
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/doc-links-body.md"
            echo "Updated pull request #$pr"
          fi

      # Re-raise whatever the check step reported, now that any moved links have been
      # committed and proposed. Without this the continue-on-error above would turn a dead
      # link, or a week where the site was unreachable, into a green run.
      - name: Report unreachable or broken links
        if: steps.links.outcome == 'failure'
        shell: bash
        run: |
          echo 'The link check reported a problem; see the "Check and repoint doc links" step.' >&2
          echo 'Exit 2 means the site could not be reached, so nothing was verified.' >&2
          echo 'Exit 3 means a doc comment cites a URL that returns an error.' >&2
          exit 1
