apiVersion: v1
kind: Service
metadata:
  name: infra-backend-v1
  namespace: default
spec:
  ports:
    - name: https
      port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: infra-backend-v2
  namespace: default
spec:
  ports:
    - name: https
      port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: infra-backend-v3
  namespace: default
spec:
  ports:
    - name: https
      port: 443
---
# A Secret CA ref resolves the same way a ConfigMap one does.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: test-tls-secret-ca
  namespace: default
spec:
  targetRefs:
    - name: infra-backend-v1
      kind: Service
      group: ""
      sectionName: https
  validation:
    hostname: example.com
    caCertificateRefs:
      - name: ca-cert-secret
        group: ""
        kind: Secret
---
# A Secret that does not exist is InvalidCACertificateRef, not InvalidKind.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: test-tls-secret-missing
  namespace: default
spec:
  targetRefs:
    - name: infra-backend-v2
      kind: Service
      group: ""
  validation:
    hostname: example.com
    caCertificateRefs:
      - name: ca-cert-absent
        group: ""
        kind: Secret
---
# Anything other than a core ConfigMap or Secret is still InvalidKind.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: test-tls-unsupported-kind
  namespace: default
spec:
  targetRefs:
    - name: infra-backend-v3
      kind: Service
      group: ""
  validation:
    hostname: example.com
    caCertificateRefs:
      - name: infra-backend-v3
        group: ""
        kind: Service
---
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: ca-cert-secret
data:
  ca.crt: 

