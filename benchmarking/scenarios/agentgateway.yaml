# agentgateway arm for the agentgateway vs plain Service comparison.
# epponly means EPP runs with a sidecar proxy and no Kubernetes Gateway in
# front, proxyType=agentgateway picks agentgateway as that sidecar instead
# of the default Envoy.
#
# Decode-only to match the baseline arm (see baseline.yaml for why).

scenario:
- name: agentgateway-decode-only
  model:
    name: facebook/opt-125m
    shortName: facebook-opt-125m
    path: models/facebook/opt-125m
    huggingfaceId: facebook/opt-125m
    maxModelLen: 1024
    gpuMemoryUtilization: 0

  # CPU-only, runs the simulated model server, no GPU needed for this pass
  affinity:
    enabled: true
    nodeSelector:
      kubernetes.io/os: linux
  accelerator:
    count: 0
    memory: 24

  gateway:
    className: epponly

  router:
    epp:
      resources:
        requests:
          cpu: "100m"
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
    proxy:
      resources:
        requests:
          cpu: "50m"
          memory: 128Mi
        limits:
          cpu: "500m"
          memory: 512Mi
      proxyType: agentgateway
      # the epponly HTTP service port defaults to envoy's port (8081), which
      # the chart rejects when proxyType=agentgateway -- has to be "http",
      # 80, or left out entirely. see llm-d-benchmark#1655
      httpTargetPort: http
      agentgateway:
        service:
          name: gap2-agw-svc
      # the chart's built-in agentgateway image preset points at a tag that
      # doesn't exist in the registry (v0.9.0), override to a real one
      presets:
        agentgateway:
          image: cr.agentgateway.dev/agentgateway:latest-dev
          pullPolicy: IfNotPresent
    inferencePool:
      # required when proxyType=agentgateway, standalone agentgateway only
      # supports service-backed routing right now
      create: false

  monitoring:
    installPrometheusCrds: true

  vllmCommon:
    shmMemory: 500Mi

  storage:
    modelPvc:
      accessModes:
        - ReadWriteOnce
      storageClassName: standard
      size: 2Gi
    workloadPvc:
      accessModes:
        - ReadWriteOnce
      storageClassName: standard
      size: 3Gi

  images:
    vllm:
      repository: ghcr.io/llm-d/llm-d-inference-sim
      tag: v0.8.2

  fma:
    enabled: false

  decode:
    replicas: 3
    parallelism:
      tensor: 0
      data: 1
      dataLocal: 1
      workers: 1
    resources:
      limits:
        memory: 100Mi
        cpu: "0"
      requests:
        memory: 100Mi
        cpu: "0"
    accelerator:
      count: 0
    vllm:
      modelCommand: imageDefault

  prefill:
    enabled: false
    replicas: 0
    parallelism:
      tensor: 0
      data: 1
      dataLocal: 1
      workers: 1
    resources:
      limits:
        memory: 100Mi
        cpu: "0"
      requests:
        memory: 100Mi
        cpu: "0"
    accelerator:
      count: 0
    vllm:
      modelCommand: imageDefault

  modelservice:
    enabled: true
    uriProtocol: hf

  control:
    waitTimeout: 20

  harness:
    name: inference-perf
    experimentProfile: sanity_random.yaml
    resources:
      cpu: "1"
      memory: 2Gi
