- gateway:
    Name: model-gateway
    Namespace: default
  resource:
    modelRoute:
      concreteModel:
        backend:
          backend: default/gpt-5-mini/backend.default.tenant1
      key: default/gpt-5-mini.default.tenant1.alternate
      listenerKey: default/model-gateway.alternate
