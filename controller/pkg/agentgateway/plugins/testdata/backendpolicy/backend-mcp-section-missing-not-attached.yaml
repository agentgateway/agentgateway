apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-route
  namespace: default
spec:
  parentRefs:
    - name: test
  rules:
    - backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-be
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-be
  namespace: default
spec:
  mcp:
    targets:
      - name: mcp-target
        static:
          host: mcp.example.com
          port: 443
          path: /v1/mcp
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agw
  namespace: default
spec:
  targetRefs:
    - kind: AgentgatewayBackend
      name: mcp-be
      group: agentgateway.dev
      sectionName: no-such-target
  backend:
    http:
      version: HTTP2

---
