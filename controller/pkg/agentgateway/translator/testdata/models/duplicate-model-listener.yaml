# Two models with the same match.model on one listener are ambiguous.
# The oldest model is programmed. The newer model is not, and a second listener
# it also attaches to is left alone. Wildcard patterns are not part of this check.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: llm
    port: 80
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: agentgateway.dev
        kind: AgentgatewayModel
      namespaces:
        from: Same
  - name: extra
    port: 81
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: agentgateway.dev
        kind: AgentgatewayModel
      namespaces:
        from: Same
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: a
  namespace: default
  creationTimestamp: "2024-01-01T00:00:00Z"
spec:
  parentRefs:
  - name: gw
    sectionName: llm
  match:
    model: gpt
  provider: OpenAI
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: b
  namespace: default
  creationTimestamp: "2024-01-02T00:00:00Z"
spec:
  parentRefs:
  - name: gw
    sectionName: llm
  - name: gw
    sectionName: extra
  match:
    model: gpt
  provider: Anthropic
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: wild
  namespace: default
  creationTimestamp: "2024-01-03T00:00:00Z"
spec:
  parentRefs:
  - name: gw
    sectionName: llm
  match:
    model: gpt-*
  provider: OpenAI

