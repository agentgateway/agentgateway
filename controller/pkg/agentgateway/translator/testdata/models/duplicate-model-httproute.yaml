# The same match.model on one HTTPRoute model rule is one router, even when
# that route is attached to more than one listener. A newer model is rejected
# on the conflicting rule and still programmed on its other rule.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
  - name: https
    port: 443
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant1
  namespace: default
spec:
  parentRefs:
  - name: gw
    sectionName: http
  - name: gw
    sectionName: https
  rules:
  - name: models
    matches:
    - path:
        type: PathPrefix
        value: /tenant1
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: "*"
  - name: other
    matches:
    - path:
        type: PathPrefix
        value: /other
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: "*"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: a
  namespace: default
  creationTimestamp: "2024-01-01T00:00:00Z"
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant1
    sectionName: models
  match:
    model: gpt
  provider: OpenAI
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: b
  namespace: default
  creationTimestamp: "2024-01-02T00:00:00Z"
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant1
    sectionName: models
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant1
    sectionName: other
  match:
    model: gpt
  provider: Anthropic

