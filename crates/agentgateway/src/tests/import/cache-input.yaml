model_list:
  - model_name: chat
    litellm_params:
      model: openai/gpt-4o
litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REPRO_REDIS_HOST
    port: 6379
    password: REPRO_SYNTHETIC_PASSWORD_NOT_A_SECRET
    ttl: 300
    namespace: migration-repro
    future_cache_option:
      nested: REPRO_SYNTHETIC_UNKNOWN_VALUE
