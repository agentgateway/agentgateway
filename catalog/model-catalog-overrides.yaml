# Hand-maintained model catalog data merged over the generated base catalog.
providers:
  "*":
    models:
      "*opus-4-6*":
        tags: [adaptive_thinking]
      "*opus-4.6*":
        tags: [adaptive_thinking]
      "*sonnet-4-6*":
        tags: [adaptive_thinking]
      "*sonnet-4.6*":
        tags: [adaptive_thinking]
  # TODO: drop once https://github.com/anomalyco/models.dev/pull/10060 lands and models.dev maps typesafe.
  typesafe:
    models:
      jev-1.13.0:
        rates: &jev-rates
          input: "0.042"
          output: "0"
        capabilities: &jev-capabilities
          structuredOutput: true
      jev-1.14.0:
        rates: *jev-rates
        capabilities: *jev-capabilities
      jev-latest:
        name: Jev Latest
        rates: *jev-rates
        capabilities: *jev-capabilities
      jev-preview:
        name: Jev Preview
        rates: *jev-rates
        capabilities: *jev-capabilities
  # Pro and codex are Responses-only; gpt-5.4+ need it for tools with reasoning.
  openai:
    models:
      gpt-5-pro:
        tags: [openai_responses]
      gpt-5.2-pro:
        tags: [openai_responses]
      gpt-5.4-pro:
        tags: [openai_responses]
      gpt-5.5-pro:
        tags: [openai_responses]
      o1-pro:
        tags: [openai_responses]
      o3-pro:
        tags: [openai_responses]
      gpt-5.3-codex:
        tags: [openai_responses]
      gpt-5.3-codex-spark:
        tags: [openai_responses]
      gpt-5.4*:
        tags: [openai_responses_for_reasoning_tools]
      gpt-5.5*:
        tags: [openai_responses_for_reasoning_tools]
      gpt-5.6*:
        tags: [openai_responses_for_reasoning_tools]
      gpt-6*:
        tags: [openai_responses_for_reasoning_tools]
