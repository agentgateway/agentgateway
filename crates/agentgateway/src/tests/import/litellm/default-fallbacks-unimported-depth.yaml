model_list:
- model_name: primary
  litellm_params:
    model: openai/gpt-4o
- model_name: backup
  litellm_params:
    model: anthropic/claude-haiku-4
- model_name: deep
  litellm_params:
    model: openai/gpt-4o-mini
- model_name: extra
  litellm_params:
    model: anthropic/claude-sonnet-4
router_settings:
  fallbacks:
  - primary: [missing, backup]
  - backup: [deep]
  max_fallbacks: 2
  default_fallbacks: [ghost, backup]
