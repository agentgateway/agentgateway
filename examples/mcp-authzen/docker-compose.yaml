services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7
    command:
    - start-dev
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 7080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: authzen
      KC_HTTP_PORT: 7080
      KC_HTTPS_PORT: 7443
      KC_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kcadm.sh", "config", "credentials", "--server", "http://localhost:7080", "--realm", "master", "--user", "admin", "--password", "admin"]
      interval: 5s
      timeout: 2s
      retries: 15 
    ports:
    - "7080:7080"
    - "7443:7443"

  keycloak-import:
    depends_on:
      keycloak:
        condition: service_healthy
    image: quay.io/keycloak/keycloak:26.7
    container_name: keycloak-import
    restart: "no"
    entrypoint:
      - "/bin/sh"
      - "-c"
      - | 
        sleep 5
        exec /opt/keycloak/bootstrap-authzen.sh
    environment:
      KEYCLOAK_URL: http://keycloak:7080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin 
    volumes:        
      - ./keycloak/bootstrap-authzen.sh:/opt/keycloak/bootstrap-authzen.sh:ro


  payments-mcp:
    container_name: payments-mcp
    build:
      context: ./apps
      dockerfile: Dockerfile
    ports:
    - "3001:3001"
