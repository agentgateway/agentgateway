apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-gateway
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant1
  namespace: default
spec:
  parentRefs:
  - name: model-gateway
    sectionName: http
  rules:
  - name: models
    matches:
    - path:
        type: PathPrefix
        value: /tenant1
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: "*"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: gpt-5-mini
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant1
  provider: OpenAI
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tenant1-auth
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant1
    sectionName: models
  traffic:
    basicAuthentication:
      secretRef:
        name: tenant1-users
---
apiVersion: v1
kind: Secret
metadata:
  name: tenant1-users
  namespace: default
stringData:
  .htpasswd: alice:hash

---
# Output
output:
- gateway:
