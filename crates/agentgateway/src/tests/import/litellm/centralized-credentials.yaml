credential_list:
- credential_name: shared-openai
  credential_info:
    provider: openai
  credential_values:
    api_key: os.environ/OPENAI_API_KEY
    api_base: https://api.openai.example/v1
model_list:
- model_name: chat
  litellm_params:
    model: openai/gpt-4o
    litellm_credential_name: shared-openai
- model_name: summarize
  litellm_params:
    model: openai/gpt-4o-mini
    litellm_credential_name: shared-openai
    temperature: 0.2
