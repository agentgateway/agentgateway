apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-named-rules
  namespace: default
spec:
  parentRefs:
    - name: test
  rules:
    - name: rule-one
      backendRefs:
        - name: reviews
          port: 8080
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agw
  namespace: default
spec:
  targetRefs:
  - kind: GRPCRoute
    name: grpc-named-rules
    group: gateway.networking.k8s.io
    sectionName: no-such-rule
  traffic:
    timeouts:
      request: 5s

---
# Output
output:
