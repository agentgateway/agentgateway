credential_list:
- credential_name: shared-vertex
  credential_values:
    vertex_project: example-project
    vertex_location: us-central1
    vertex_credentials: /var/run/secrets/vertex/shared.json
model_list:
- model_name: file
  litellm_params:
    model: vertex_ai/gemini-2.5-flash
    vertex_project: example-project
    vertex_location: us-central1
    vertex_credentials: /var/run/secrets/vertex/credentials.json
- model_name: relative
  litellm_params:
    model: vertex_ai/gemini-2.5-flash
    vertex_project: example-project
    vertex_location: europe-west4
    vertex_ai_credentials: secrets/credentials.json
- model_name: ambient
  litellm_params:
    model: vertex_ai/gemini-2.5-flash
    vertex_project: example-project
    vertex_location: us-central1
- model_name: shared
  litellm_params:
    model: vertex_ai/gemini-2.5-pro
    litellm_credential_name: shared-vertex
- model_name: inline
  litellm_params:
    model: vertex_ai/gemini-2.5-flash
    vertex_project: example-project
    vertex_credentials: '{"type": "service_account", "private_key": "SENTINEL-vertex-secret-7f3a"}'
- model_name: environment
  litellm_params:
    model: vertex_ai/gemini-2.5-flash
    vertex_project: example-project
    vertex_credentials: os.environ/VERTEX_CREDENTIALS
