apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-gateway
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      filters:
        requests:
          - type: ExternalAuth
            externalAuth:
              protocol: GRPC
              backendRef:
                name: ext-auth
                port: 9000
    - name: extension-ref
      port: 8080
      protocol: HTTP
      filters:
        requests:
          - type: ExtensionRef
            extensionRef:
              group: example.com
              kind: Filter
              name: example
    - name: missing-backend
      port: 8081
      protocol: HTTP
      filters:
        requests:
          - type: ExternalAuth
            externalAuth:
              protocol: GRPC
              backendRef:
                name: missing
                port: 9000
    - name: agw-backend
      port: 8082
      protocol: HTTP
      filters:
        requests:
          - type: ExternalAuth
            externalAuth:
              protocol: HTTP
              backendRef:
                group: agentgateway.dev
                kind: AgentgatewayBackend
                name: auth-backend
---
apiVersion: v1
kind: Service
metadata:
  name: ext-auth
  namespace: default
spec:
  ports:
    - name: grpc
      port: 9000
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: auth-backend
  namespace: default
spec:
  static:
    host: auth.example.com
    port: 8080

---
