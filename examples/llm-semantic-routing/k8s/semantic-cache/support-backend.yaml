apiVersion: v1
kind: Namespace
metadata:
  name: homehub
  labels:
    app.kubernetes.io/part-of: semantic-cache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: support-backend
  namespace: homehub
  labels:
    app.kubernetes.io/name: support-backend
    app.kubernetes.io/part-of: semantic-cache
data:
  server.py: |
    import json
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    lock = threading.Lock()
    state = {"invocations": 0, "prompts": []}

    def support_answer(prompt):
        text = prompt.lower()
        if "x2" in text and any(word in text for word in ("factory", "reset", "restore")):
            return (
                "To factory-reset a HomeHub X2, hold the recessed Reset button "
                "for 10 seconds until the status ring flashes amber, then release it."
            )
        if "firmware" in text or "software update" in text:
            return (
                "Open the HomeHub app, select the device, and choose Settings > "
                "Device update to install the latest firmware."
            )
        if "warranty" in text:
            return (
                "HomeHub devices include a one-year limited hardware warranty; "
                "accidental damage is not covered."
            )
        if "outdoor" in text or "freezing" in text:
            return (
                "HomeHub devices are rated for indoor use only and should not "
                "be exposed to rain or freezing temperatures."
            )
        if "x3" in text and any(word in text for word in ("factory", "reset", "restore")):
            return (
                "To factory-reset a HomeHub X3, hold both side buttons for "
                "15 seconds until the display shows Resetting."
            )
        return "Contact HomeHub support with the product model and diagnostic code."

    class Handler(BaseHTTPRequestHandler):
        server_version = "HomeHubSupport/1.0"

        def log_message(self, format, *args):
            return

        def write_json(self, status, payload, headers=None):
            body = json.dumps(payload, separators=(",", ":")).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            for name, value in (headers or {}).items():
                self.send_header(name, str(value))
            self.end_headers()
            self.wfile.write(body)

        def read_json(self):
            length = int(self.headers.get("Content-Length", "0"))
            return json.loads(self.rfile.read(length) or b"{}")

        def do_GET(self):
            if self.path == "/healthz":
                self.write_json(200, {"status": "ok"})
                return
            if self.path == "/stats":
                with lock:
                    payload = {
                        "invocations": state["invocations"],
                        "prompts": list(state["prompts"]),
                    }
                self.write_json(200, payload)
                return
            self.write_json(404, {"error": "not found"})

        def do_POST(self):
            if self.path == "/admin/reset":
                with lock:
                    state["invocations"] = 0
                    state["prompts"].clear()
                self.write_json(200, {"status": "reset"})
                return
            if self.path != "/v1/chat/completions":
                self.write_json(404, {"error": "not found"})
                return
            try:
                request = self.read_json()
                prompt = "\n".join(
                    str(message.get("content", ""))
                    for message in request.get("messages", [])
                    if message.get("role") == "user"
                )
            except (ValueError, TypeError) as error:
                self.write_json(400, {"error": str(error)})
                return
            with lock:
                state["invocations"] += 1
                invocation = state["invocations"]
                state["prompts"].append(prompt)
            response = {
                "id": "chatcmpl-homehub-support",
                "object": "chat.completion",
                "created": 0,
                "model": "homehub-support",
                "choices": [{
                    "index": 0,
                    "message": {
                        "role": "assistant",
                        "content": support_answer(prompt),
                    },
                    "finish_reason": "stop",
                }],
                "usage": {
                    "prompt_tokens": 12,
                    "completion_tokens": 24,
                    "total_tokens": 36,
                },
            }
            self.write_json(
                200,
                response,
                {"X-Support-Backend-Invocation": invocation},
            )

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-backend
  namespace: homehub
  labels:
    app.kubernetes.io/name: support-backend
    app.kubernetes.io/part-of: semantic-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-backend
        app.kubernetes.io/part-of: semantic-cache
    spec:
      containers:
      - name: backend
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command: [python, /app/server.py]
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 1
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - name: application
          mountPath: /app
          readOnly: true
      volumes:
      - name: application
        configMap:
          name: support-backend
---
apiVersion: v1
kind: Service
metadata:
  name: support-backend
  namespace: homehub
  labels:
    app.kubernetes.io/name: support-backend
    app.kubernetes.io/part-of: semantic-cache
spec:
  selector:
    app.kubernetes.io/name: support-backend
  ports:
  - name: http
    port: 8080
    targetPort: http
