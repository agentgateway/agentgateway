syntax = "proto3";

package ateapi;

// Minimal wire-compatible subset of the Substrate control API used by
// agentgateway's actor policies.
service Control {
  rpc GetActor(GetActorRequest) returns (Actor) {}
  rpc ResumeActor(ResumeActorRequest) returns (ResumeActorResponse) {}
}

message Actor {
  ResourceMetadata metadata = 1;
  ActorStatus status = 7;
}

message ActorStatus {
  ActorState state = 1;
  WorkerAssignment worker_assignment = 2;
}

enum ActorState {
  ACTOR_STATE_UNSPECIFIED = 0;
  ACTOR_STATE_RESUMING = 1;
  ACTOR_STATE_RUNNING = 2;
  ACTOR_STATE_SUSPENDING = 3;
  ACTOR_STATE_SUSPENDED = 4;
  ACTOR_STATE_PAUSING = 5;
  ACTOR_STATE_PAUSED = 6;
  ACTOR_STATE_CRASHED = 7;
  ACTOR_STATE_DELETING = 8;
}

// The minimal running-actor assignment required by AgentGateway ingress.
message WorkerAssignment {
  string worker_pod_ip = 5;
}

message ResourceMetadata {
  string uid = 3;
  int64 version = 4;
}

message ObjectRef {
  string atespace = 1;
  string name = 2;
}

message ResumeActorRequest {
  ObjectRef actor = 1;
  bool boot = 2;
}

message ResumeActorResponse {
  Actor actor = 1;
}

message GetActorRequest {
  ObjectRef actor = 1;
}
