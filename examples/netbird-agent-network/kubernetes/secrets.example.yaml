# Render with envsubst and pipe directly to kubectl; do not save credentials.
apiVersion: v1
kind: Secret
metadata:
  name: netbird-openai
  namespace: netbird-agent-network
type: Opaque
stringData:
  Authorization: "${OPENAI_API_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: netbird-anthropic
  namespace: netbird-agent-network
type: Opaque
stringData:
  Authorization: "${ANTHROPIC_API_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: netbird-agentgateway-keys
  namespace: netbird-agent-network
type: Opaque
stringData:
  netbird: '{"keyHash":"sha256:${NETBIRD_VIRTUAL_KEY_SHA256}"}'
