apiVersion: v1
kind: Namespace
metadata:
  name: cross-ns-with-grant
---
apiVersion: v1
kind: Namespace
metadata:
  name: cross-ns-without-grant
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cross-ns-with-refgrant
  namespace: default
spec:
  parentRefs:
    - name: test-gateway
  rules:
    - backendRefs:
        - name: cross-ns-service-with-grant
          namespace: cross-ns-with-grant
          port: 8080
        - name: cross-ns-backend-with-grant
          namespace: cross-ns-with-grant
          group: agentgateway.dev
          kind: AgentgatewayBackend
        - name: cross-ns-pool-with-grant
          namespace: cross-ns-with-grant
          group: inference.networking.k8s.io
          kind: InferencePool
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cross-ns-without-refgrant
  namespace: default
spec:
  parentRefs:
    - name: test-gateway
  rules:
    - backendRefs:
        - name: cross-ns-service-without-grant
          namespace: cross-ns-without-grant
          port: 8080
        - name: cross-ns-backend-without-grant
          namespace: cross-ns-without-grant
          group: agentgateway.dev
          kind: AgentgatewayBackend
        - name: cross-ns-pool-without-grant
          namespace: cross-ns-without-grant
          group: inference.networking.k8s.io
          kind: InferencePool
---
apiVersion: v1
kind: Service
metadata:
  name: cross-ns-service-with-grant
  namespace: cross-ns-with-grant
spec:
  ports:
    - port: 8080
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: cross-ns-backend-with-grant
  namespace: cross-ns-with-grant
spec:
  static:
    host: with-grant.example.com
    port: 80
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: cross-ns-pool-with-grant
  namespace: cross-ns-with-grant
spec:
  endpointPickerRef:
    failureMode: FailClose
    group: ""
    kind: Service
    name: cross-ns-service-with-grant
    port:
      number: 8080
  selector:
    matchLabels:
      app: with-grant
  targetPorts:
    - number: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-default-httproute
  namespace: cross-ns-with-grant
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
      name: cross-ns-service-with-grant
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: cross-ns-backend-with-grant
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: cross-ns-pool-with-grant
---
apiVersion: v1
kind: Service
metadata:
  name: cross-ns-service-without-grant
  namespace: cross-ns-without-grant
spec:
  ports:
    - port: 8080
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: cross-ns-backend-without-grant
  namespace: cross-ns-without-grant
spec:
  static:
    host: without-grant.example.com
    port: 80
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: cross-ns-pool-without-grant
  namespace: cross-ns-without-grant
spec:
  endpointPickerRef:
    failureMode: FailClose
    group: ""
    kind: Service
    name: cross-ns-service-without-grant
    port:
      number: 8080
  selector:
    matchLabels:
      app: without-grant
  targetPorts:
    - number: 8080

---
