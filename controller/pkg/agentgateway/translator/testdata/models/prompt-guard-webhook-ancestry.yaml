apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-gateway
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: llm
    protocol: HTTP
    port: 8080
    allowedRoutes:
      kinds:
      - group: agentgateway.dev
        kind: AgentgatewayModel
---
apiVersion: v1
kind: Service
metadata:
  name: guardrail-webhook
  namespace: default
spec:
  selector:
    app: guardrail-webhook
  ports:
  - port: 8443
    targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: default
spec:
  ports:
  - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: oauth-token-exchange
  namespace: default
spec:
  ports:
  - port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: moderation-proxy
  namespace: default
spec:
  ports:
  - port: 8082
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: guardrail-webhook-policy
  namespace: default
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: guardrail-webhook
  - group: ""
    kind: Service
    name: egress-proxy
  - group: ""
    kind: Service
    name: oauth-token-exchange
  - group: ""
    kind: Service
    name: moderation-proxy
  backend:
    auth:
      key: synthetic-test-token
    http:
      requestTimeout: 5s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: guarded-model
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: llm-gateway
    sectionName: llm
  provider: OpenAI
  baseURL: http://model-upstream.default.svc.cluster.local:8080/v1
  policies:
    tunnel:
      backendRef:
        name: egress-proxy
        port: 8080
    auth:
      oauthTokenExchange:
        backendRef:
          name: oauth-token-exchange
          port: 8081
    promptGuard:
      request:
      - webhook:
          action: Reject
          backendRef:
            group: ""
            kind: Service
            name: guardrail-webhook
            port: 8443
      - openAIModeration:
          policies:
            tunnel:
              backendRef:
                name: moderation-proxy
                port: 8082

---
# Output
output:
- gateway:
    Name: llm-gateway
    Namespace: default
  resource:
    backend:
      ai:
        providerGroups:
        - providers:
          - baseUrl: http://model-upstream.default.svc.cluster.local:8080/v1
            inlinePolicies:
            - backendTunnel:
                proxy:
                  port: 8080
                  service:
                    hostname: egress-proxy.default.svc.cluster.local
                    namespace: default
            - ai:
                promptGuard:
