#refresh=true
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{.Name}}
spec:
  gatewayClassName: {{.className}}
  allowedListeners:
    namespaces:
      from: All
  listeners:
  - name: default
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: api
    port: 8080
    protocol: HTTP
    hostname: api-{{.RandNumber}}.example.com
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: {{.Name}}
    allowedRoutes:
      namespaces:
        from: All
