credential_list:
- credential_name: openai-org
  credential_info:
    provider: openai
  credential_values:
    api_key: os.environ/OPENAI_API_KEY
    organization: os.environ/OPENAI_ORGANIZATION
    extra_headers:
      X-Credential-Header: credential
- credential_name: ollama-org-only
  credential_info:
    provider: ollama
  credential_values:
    organization: ignored-by-ollama
model_list:
- model_name: chat
  litellm_params:
    model: openai/gpt-4o
    litellm_credential_name: openai-org
- model_name: chat-with-overrides
  litellm_params:
    model: openai/gpt-4o-mini
    litellm_credential_name: openai-org
    extra_headers:
      X-Credential-Header: model
      X-Request-ID: os.environ/REQUEST_ID
- model_name: chat-with-empty-headers
  litellm_params:
    model: openai/gpt-4.1
    litellm_credential_name: openai-org
    extra_headers: {}
- model_name: chat-inline-with-overrides
  litellm_params:
    model: openai/gpt-4.1-mini
    litellm_credential_name: openai-org
    api_base: https://example.com/v1
    extra_headers:
      X-Inline: model
- model_name: chat-inline-with-empty-headers
  litellm_params:
    model: openai/gpt-4.1-nano
    litellm_credential_name: openai-org
    api_base: https://example.com/v1
    extra_headers: {}
- model_name: chat-with-organization-override
  litellm_params:
    model: openai/o3
    litellm_credential_name: openai-org
    organization: os.environ/MODEL_ORGANIZATION
- model_name: chat-inline-with-organization-override
  litellm_params:
    model: openai/o3-mini
    litellm_credential_name: openai-org
    api_base: https://example.com/v1
    organization: os.environ/MODEL_ORGANIZATION
- model_name: chat-with-invalid-headers
  litellm_params:
    model: openai/gpt-5
    litellm_credential_name: openai-org
    extra_headers: []
- model_name: chat-inline-with-invalid-headers
  litellm_params:
    model: openai/gpt-5-mini
    litellm_credential_name: openai-org
    api_base: https://example.com/v1
    extra_headers: []
- model_name: chat-with-invalid-organization
  litellm_params:
    model: openai/gpt-5.1
    litellm_credential_name: openai-org
    organization: [invalid]
- model_name: chat-inline-with-empty-organization
  litellm_params:
    model: openai/gpt-5.1-mini
    litellm_credential_name: openai-org
    api_base: https://example.com/v1
    organization: ""
- model_name: local
  litellm_params:
    model: ollama/llama3
    api_base: http://localhost:11434/v1
    litellm_credential_name: ollama-org-only
    organization: ignored-by-ollama
    extra_headers:
      X-Static: "yes"
