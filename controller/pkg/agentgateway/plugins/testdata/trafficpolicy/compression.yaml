apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: compression
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: test
  traffic:
    compression:
      responseCompression: {}
      requestDecompression:
        acceptedAlgorithms:
        - Brotli
        - Deflate
        - Zstd
---
# Output
output:
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      key: traffic/default/compression:compression:default/test
      name:
        kind: AgentgatewayPolicy
        name: compression
        namespace: default
      target:
        route:
          kind: HTTPRoute
          name: test
          namespace: default
      traffic:
        compression:
          requestDecompression:
            acceptedAlgorithms:
            - BROTLI
            - DEFLATE
            - ZSTD
          responseCompression:
            preferredAlgorithms:
            - GZIP
status:
