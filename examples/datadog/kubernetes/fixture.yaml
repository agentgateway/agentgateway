apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-fixture
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datadog-fixture
  template:
    metadata:
      labels:
        app: datadog-fixture
    spec:
      containers:
      - name: fixture
        image: agentgateway-datadog-fixture:local
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: datadog-fixture
  namespace: agentgateway-system
spec:
  selector:
    app: datadog-fixture
  ports:
  - name: http
    port: 8080
    targetPort: http
