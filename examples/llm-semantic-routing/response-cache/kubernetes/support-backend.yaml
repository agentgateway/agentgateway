apiVersion: v1
kind: Namespace
metadata:
  name: homehub
  labels:
    app.kubernetes.io/part-of: semantic-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-backend
  namespace: homehub
  labels:
    app.kubernetes.io/name: support-backend
    app.kubernetes.io/part-of: semantic-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-backend
        app.kubernetes.io/part-of: semantic-cache
    spec:
      containers:
      - name: backend
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command: [python, /app/server.py]
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 1
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - name: application
          mountPath: /app
          readOnly: true
      volumes:
      - name: application
        configMap:
          name: support-backend
---
apiVersion: v1
kind: Service
metadata:
  name: support-backend
  namespace: homehub
  labels:
    app.kubernetes.io/name: support-backend
    app.kubernetes.io/part-of: semantic-cache
spec:
  selector:
    app.kubernetes.io/name: support-backend
  ports:
  - name: http
    port: 8080
    targetPort: http
