                  - webhook:
                      action: REJECT_AUDIT_ACTION_REJECT
                      backend:
                        port: 8443
                        service:
                          hostname: guardrail-webhook.default.svc.cluster.local
                          namespace: default
                  - openaiModeration:
                      action: REJECT_AUDIT_ACTION_REJECT
                      inlinePolicies:
                      - backendTunnel:
                          proxy:
                            port: 8082
                            service:
                              hostname: moderation-proxy.default.svc.cluster.local
                              namespace: default
            - auth:
                oauthTokenExchange:
                  tokenEndpoint:
                    port: 8081
                    service:
                      hostname: oauth-token-exchange.default.svc.cluster.local
                      namespace: default
            name: backend
            openai: {}
      key: default/guarded-model/backend.llm
      name:
        name: guarded-model
        namespace: default
- gateway:
    Name: llm-gateway
