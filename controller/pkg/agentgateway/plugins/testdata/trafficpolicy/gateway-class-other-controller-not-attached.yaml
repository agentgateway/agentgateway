apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: other-class
spec:
  controllerName: example.com/other-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: other-gw
  namespace: default
spec:
  gatewayClassName: other-class
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agw
  namespace: default
spec:
  targetRefs:
  - kind: Gateway
    name: other-gw
    group: gateway.networking.k8s.io
  traffic:
    timeouts:
      request: 5s
---
